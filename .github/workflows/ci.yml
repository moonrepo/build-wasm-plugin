name: 'Pipeline'
on:
  push:
    branches:
      - 'master'
  pull_request:
jobs:
  ci:
    name: 'CI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm run check
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm run build
      - run: node ./dist/index.js
        with:
          publish: 'true'
        env:
          TEST_AUTH: true
      - run: node ./dist/index.js && ls -lR ~/binaryen ~/wabt ~/oras
        env:
          TEST_BINS: true
